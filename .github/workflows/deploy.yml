name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # so you can trigger it manually from Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        # if you don't have package-lock.json, use:
        # run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # target branch
          folder: dist # Vite output
          clean: true
          cname: islam.ryqo.ai # writes CNAME into gh-pages
